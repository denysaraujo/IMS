<div class="px-4 py-6 sm:px-0">
  <div class="bg-white/80 dark:bg-gray-900/80 backdrop-blur-xl border border-gray-200/50 dark:border-gray-700/50 rounded-2xl shadow-xl overflow-hidden">
    <div class="px-6 py-5 sm:p-6">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-2">
            👥 Gestão de Clientes
          </h2>
          <p class="text-gray-600 dark:text-gray-300">
            Cadastro e gerenciamento de clientes do sistema.
          </p>
        </div>
        <div class="flex space-x-3">
          <button (click)="createNew.emit()" 
                  [disabled]="isLoading"
                  class="px-4 py-2 bg-gradient-to-r from-green-500 to-teal-600 text-white text-sm font-medium rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="fas fa-plus mr-2"></i>
            {{ isLoading ? 'Carregando...' : 'Novo Cliente' }}
          </button>
          <div class="flex space-x-2">
            <span class="px-3 py-2 bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 text-sm font-medium rounded-xl">
              {{ customerStats.totalCustomers }} Clientes
            </span>
            <span class="px-3 py-2 bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200 text-sm font-medium rounded-xl">
              {{ customerStats.individualCustomers }} PF
            </span>
            <span class="px-3 py-2 bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-200 text-sm font-medium rounded-xl">
              {{ customerStats.companyCustomers }} PJ
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
