<div *ngIf="!isLoginPage; else loginPageTemplate"
  class="flex h-screen flex-col overflow-hidden bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800">

  <app-navbar class="sticky top-0 z-50 shrink-0 shadow-lg"></app-navbar>

  <div class="flex min-h-0 flex-1 gap-3 px-3 pb-3 pt-3">
    <app-sidebar class="z-40 shrink-0"></app-sidebar>

    <main class="min-h-0 flex-1 overflow-hidden">
      <div class="h-full rounded-2xl border border-white/20 bg-white/80 shadow-xl backdrop-blur-lg dark:border-gray-700/20 dark:bg-gray-800/80">
        <div class="h-full overflow-auto p-3 lg:p-4">
          <router-outlet></router-outlet>
        </div>
      </div>
    </main>
  </div>

  <app-footer class="shrink-0 border-t border-gray-200/50 dark:border-gray-700/50"></app-footer>
</div>

<!-- Template para página de login -->
<ng-template #loginPageTemplate>
  <router-outlet></router-outlet>
</ng-template>
